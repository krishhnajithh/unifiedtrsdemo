<!DOCTYPE html>
<html>
<head>
    <title>Admin Login | UTRS</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #020617, #0f172a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            color: white;
        }

        .login-box {
            width: 380px;
            padding: 40px;
            background: linear-gradient(145deg, #0f172a, #020617);
            border-radius: 18px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.7);
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            font-weight: 600;
        }

        input {
            width: 90%;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        button {
            width: 95%;
            padding: 12px;
            background: #38bdf8;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .error {
            color: #f87171;
            font-size: 14px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Admin Login</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{% url 'adminapp:admin_login' %}">
    {% csrf_token %}
    <input type="text" name="username" placeholder="Admin Username" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Login</button>
</form>
</div>

</body>
</html>
