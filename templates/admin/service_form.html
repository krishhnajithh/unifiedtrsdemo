<!DOCTYPE html>
<html>
<head>
    <title>Add Service</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #071428;
            color: white;
        }

        .container {
            max-width: 650px;
            margin: 60px auto;
            background: #0e1f3b;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 28px;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 10px;
            border: none;
            background: #13284a;
            color: white;
            outline: none;
        }

        input::placeholder,
        textarea::placeholder {
            color: #9aa7bd;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input[type="file"] {
            background: none;
            padding: 8px 0;
        }

        .btn {
            margin-top: 30px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1e90ff, #2563eb);
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            color: white;
            transition: 0.3s ease;
        }

        .btn:hover {
            box-shadow: 0 0 20px rgba(37,99,235,0.6);
            transform: translateY(-3px);
        }

        .field-section {
            margin-top: 10px;
        }

        footer {
            text-align: center;
            padding: 30px;
            margin-top: 60px;
            background: #0c1c34;
            color: #aab6c8;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Add Service</h2>

    <form method="POST"
          enctype="multipart/form-data"
          action="{% url 'adminapp:add_service' %}">

        {% csrf_token %}

        <!-- NAME -->
        <label>Name</label>
        <input type="text" name="name" required>

        <!-- TYPE -->
        <label>Type</label>
        <select name="code" id="serviceType" required>
            <option value="">Select</option>
            <option value="train">Train</option>
            <option value="bus">Bus</option>
            <option value="movie">Movie</option>
            <option value="hotel">Hotel</option>
            <option value="restaurant">Restaurant</option>
        </select>

        <!-- DESCRIPTION -->
        <label>Description</label>
        <textarea name="description" required></textarea>

        <!-- TRAVEL FIELDS -->
        <div id="travelFields" class="field-section" style="display:none;">
            <label>Source</label>
            <input type="text" name="source">

            <label>Destination</label>
            <input type="text" name="destination">
        </div>

        <!-- LOCATION FIELD -->
        <div id="locationField" class="field-section" style="display:none;">
            <label id="locationLabel">Location</label>
            <input type="text" name="location">
        </div>

        <!-- IMAGE -->
        <label>Image</label>
        <input type="file" name="image" required>

        <button type="submit" class="btn">Save</button>

    </form>
</div>

<footer>
    © 2026 Unified Ticket Reservation System. All rights reserved.
</footer>

<script>
    const serviceType = document.getElementById("serviceType");
    const travelFields = document.getElementById("travelFields");
    const locationField = document.getElementById("locationField");
    const locationLabel = document.getElementById("locationLabel");

    function updateFields() {
        const value = serviceType.value;

        travelFields.style.display = "none";
        locationField.style.display = "none";

        if (value === "train" || value === "bus") {
            travelFields.style.display = "block";
        }

        if (value === "hotel" || value === "restaurant") {
            locationField.style.display = "block";
            locationLabel.innerText = "Location";
        }

        if (value === "movie") {
            locationField.style.display = "block";
            locationLabel.innerText = "Theatre Name";
        }
    }

    serviceType.addEventListener("change", updateFields);
    updateFields();
</script>

</body>
</html>
