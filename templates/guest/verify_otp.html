<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UTRS | Verify OTP</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <style>
        body {
            height: 100vh;
            background: #020617;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
        }

        .box {
            background: #0f172a;
            padding: 40px;
            border-radius: 18px;
            width: 360px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #38bdf8;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: none;
            background: #020617;
            color: #ffffff;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #38bdf8;
            color: #020617;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>OTP Verification</h2>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="otp" placeholder="Enter 6-digit OTP" required>
        <button type="submit">Verify & Create Account</button>
    </form>
</div>

</body>
</html>
