<style>
body{
background:#081a36;
color:white;
font-family:Arial;
}

.booking-container{
max-width:700px;
margin:60px auto;
background:#0f2a4d;
padding:40px;
border-radius:16px;
box-shadow:0 10px 40px rgba(0,0,0,0.5);
text-align:center;
}

.booking-container h2{
margin-bottom:25px;
}

.form-group{
text-align:left;
margin-bottom:15px;
}

.form-group label{
display:block;
margin-bottom:5px;
}

.form-group input,
.form-group select{
width:100%;
padding:10px;
border-radius:6px;
border:none;
outline:none;
}

.book-btn{
margin-top:20px;
padding:12px 30px;
background:#2563eb;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
transition:0.2s;
}

.book-btn:hover{
background:#1d4ed8;
}
</style>


<div class="booking-container">

<h2>Book Room - {{ service.name }}</h2>

<form method="POST">
{% csrf_token %}

<div class="form-group">
<label>Check-in Date</label>
<input type="date" name="check_in" required>
</div>

<div class="form-group">
<label>Check-out Date</label>
<input type="date" name="check_out" required>
</div>

<div class="form-group">
<label>Room Type</label>
<select name="room_type">
<option value="Standard">Standard ₹2000</option>
<option value="Deluxe">Deluxe ₹3000</option>
<option value="Suite">Suite ₹5000</option>
</select>
</div>

<div class="form-group">
<label>Guests</label>
<input type="number" name="guests" min="1" max="5" required>
</div>

<button class="book-btn" type="submit">
Continue to Payment
</button>

</form>

</div>
