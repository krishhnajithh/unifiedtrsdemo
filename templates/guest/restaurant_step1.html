<!DOCTYPE html>
<html>
<head>
<title>Book Table</title>

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg,#071a2f,#0b2447);
    color: white;
}

/* CARD */
.container {
    width: 400px;
    margin: 80px auto;
    background: #0f2a4d;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
}

/* TITLE */
h2 {
    margin-bottom: 20px;
}

/* TIME DISPLAY */
.time-display {
    font-size: 40px;
    font-weight: bold;
    color: #4da3ff;
    margin: 20px 0;
}

.time-slots, .guest-box {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 15px 0;
}

.time-slots div, .guest-box div {
    padding: 10px 16px;
    background: #13284a;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}

.time-slots div:hover,
.guest-box div:hover {
    background: #1e40af;
}

.time-slots .active,
.guest-box .active {
    background: #2ecc71;
    color: white;
}

.btn {
    margin-top: 20px;
    padding: 12px 30px;
    background: linear-gradient(135deg,#1e90ff,#2563eb);
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">   
<form method="POST">
    {% if error %}
    <p style="color:red;">{{ error }}</p>
    {% endif %}
    {% csrf_token %}

    <input type="hidden" name="time" id="selectedTime">
    <input type="hidden" name="guests" id="selectedGuests">
    <input type="hidden" name="date" value="{{ today|date:'Y-m-d' }}">

    <h2>🍽 Book a Table</h2>

    <h3>Select Time</h3>
    <div class="time-slots">
        <div data-time="18:00" onclick="selectTime(this)">6:00 PM</div>
        <div data-time="19:00" onclick="selectTime(this)">7:00 PM</div>
        <div data-time="20:00" onclick="selectTime(this)">8:00 PM</div>
        <div data-time="21:00" onclick="selectTime(this)">9:00 PM</div>
        <div data-time="22:00" onclick="selectTime(this)">10:00 PM</div>
    </div>

    <h3>How many people?</h3>
    <div class="guest-box">
        <div data-value="1" onclick="selectGuests(this)">1</div>
        <div data-value="2" onclick="selectGuests(this)">2</div>
        <div data-value="3" onclick="selectGuests(this)">3</div>
        <div data-value="4" onclick="selectGuests(this)">4</div>
        <div data-value="5" onclick="selectGuests(this)">5+</div>
    </div>

    <button type="submit" class="btn">Next</button>
</form>
</div>
<script>

function selectTime(el) {
    document.querySelectorAll(".time-slots div").forEach(e => {
        e.classList.remove("active");
    });

    el.classList.add("active");

    // ✅ use data-time
    document.getElementById("selectedTime").value = el.dataset.time;
}

function selectGuests(el) {
    document.querySelectorAll(".guest-box div").forEach(e => {
        e.classList.remove("active");
    });

    el.classList.add("active");

    // ✅ use data-value
    document.getElementById("selectedGuests").value = el.dataset.value;
}
</script>

</body>
</html>
